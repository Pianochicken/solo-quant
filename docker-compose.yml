services:
  db:
    image: postgres:15-alpine
    container_name: solo-quant-db
    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: solo-quant-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Taipei
      - DATABASE_URL=postgresql+psycopg2://quant_user:quant_password@db:5432/quant_db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NEXT_PUBLIC_TIMEZONE_OFFSET=${NEXT_PUBLIC_TIMEZONE_OFFSET:-8}
    restart: unless-stopped

  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_TIMEZONE_OFFSET=${NEXT_PUBLIC_TIMEZONE_OFFSET:-8}
    container_name: solo-quant-web
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Taipei
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_TIMEZONE_OFFSET=${NEXT_PUBLIC_TIMEZONE_OFFSET:-8}
    depends_on:
      - fastapi
    restart: unless-stopped

volumes:
  postgres_data:
