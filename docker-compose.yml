services:
  db:
    image: postgres:15-alpine
    container_name: solo-quant-db
    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: solo-quant-api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://quant_user:quant_password@db:5432/quant_db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NEXT_PUBLIC_TIMEZONE_OFFSET=${NEXT_PUBLIC_TIMEZONE_OFFSET:-0}
    restart: unless-stopped

  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: solo-quant-web
    ports:
      - "3000:3000"
    environment:
      # In local Docker, Next.js client-side still fetches from localhost:8000 (if host network) or explicitly via container port mapping
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_TIMEZONE_OFFSET=${NEXT_PUBLIC_TIMEZONE_OFFSET:-0}
    depends_on:
      - fastapi
    restart: unless-stopped

volumes:
  postgres_data:
